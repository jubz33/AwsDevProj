
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pf
spec:
  replicas: 2

  selector:
    matchLabels:
      app: pf
      
  template:
    metadata:
      labels:
        app: pf
    spec:
      containers:
      - name: pf-container
        image: ghcr.io/jubz33/portfolio-image:stable
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

        