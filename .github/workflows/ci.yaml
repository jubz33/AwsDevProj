name: Portfolio CI

permissions:
  contents: read
  packages: write
  
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs: 
  build: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup DockerImage
        run: docker build -t ghcr.io/jubz33/portfolio-image:v2 .

      - name: Run Container
        run: docker run --name test1 -d -p 8080:80 ghcr.io/jubz33/portfolio-image:v2

      - name: Test Container 
        run: curl -f --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8080 
        # test running container
        # -f - fail silently (no output at all) on server errors
        # --retry 5 - retry 5 times before giving up
        # --retry-delay 2 - wait 2 seconds between retries
        # --retry-connrefused - retry even if connection is refused

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Image
        run: docker tag portfolio-image:v2 ghcr.io/${{ github.repository_owner }}/portfolio-image:v2
