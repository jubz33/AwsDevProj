name: Portfolio CI

permissions:
  contents: read
  packages: write
  
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs: 
  build: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup DockerImage
        run: docker build -t ghcr.io/jubz33/portfolio-image:${{ github.sha }} .

      - name: Run Container
        run: docker run --name test1 -d -p 8080:80 ghcr.io/jubz33/portfolio-image:${{ github.sha }}

      - name: Wait for Nginx Startup
        run: sleep 5
        
      - name: Test Container 
        run: curl -f --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8080 
        # test running container
        # -f - fail silently (no output at all) on server errors
        # --retry 5 - retry 5 times before giving up
        # --retry-delay 2 - wait 2 seconds between retries
        # --retry-connrefused - retry even if connection is refused

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image
        run: |
            docker push ghcr.io/jubz33/portfolio-image:${{ github.sha }}
            docker tag ghcr.io/jubz33/portfolio-image:${{ github.sha }} ghcr.io/jubz33/portfolio-image:stable
            docker push ghcr.io/jubz33/portfolio-image:stable

