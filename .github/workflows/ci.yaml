name: Portfolio CI
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs: 
  build: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup DockerImage
        run: docker build -t portfolio-image:v2 .

      - name: Run Container
        run: docker run --name test1 -d -p 8080:80 portfolio-image:v2